<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keuzedelen | Ter AA ICT</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 540px;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background: #0b0e16;
    }
    body { padding: 0 10px 10px; }
    main {
      position: relative;
      width: min(1000px, 100%);
      height: 480px;
      margin: 50px auto 0;
      padding: 13px 24px;
      border: 2px solid #ff5900;
      border-radius: 20px;
      background: linear-gradient(125deg, #101b32 0%, #25324d 35%, #694039 70%, #b44d20 100%);
      box-shadow: 0 0 18px rgba(255, 89, 0, .25), inset 0 0 30px rgba(0, 0, 0, .3);
    }
    header { height: 62px; display: flex; justify-content: space-between; align-items: center; margin: 0 4px 12px; }
    .logo { max-height: 54px; width: auto; object-fit: contain; }
    .slogan { color: #ff5900; font-weight: 900; font-size: clamp(1.45rem, 3vw, 2.25rem); letter-spacing: .04em; text-shadow: 0 2px 9px #000, 0 0 13px rgba(255, 89, 0, .55); }
    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 21px 25px;
      align-items: start;
    }
    .card { --colour: #62d7ff; text-align: center; }
    .card a { display: inline-block; width: 100%; text-decoration: none; color: #fff; outline: none; }
    .image-wrap {
      position: relative;
      display: block;
      padding: 5px;
      border-radius: 17px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--colour) 75%, white), var(--colour));
      box-shadow: 0 0 12px var(--colour), 0 0 30px color-mix(in srgb, var(--colour) 68%, transparent), 0 0 60px color-mix(in srgb, var(--colour) 40%, transparent);
      transition: transform .24s ease, box-shadow .24s ease, filter .24s ease;
    }
    img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; background: #151925; }
    .name { display: block; margin-top: 8px; font-size: clamp(.9rem, 1.45vw, 1.12rem); font-weight: 800; letter-spacing: .025em; text-shadow: 0 2px 8px #000; }
    .card a:hover .image-wrap, .card a:focus-visible .image-wrap { transform: translateY(-8px) scale(1.025); filter: brightness(1.12); box-shadow: 0 0 16px var(--colour), 0 0 42px var(--colour), 0 0 80px color-mix(in srgb, var(--colour) 70%, transparent); }
    .card a:focus-visible .image-wrap { outline: 3px solid #fff; outline-offset: 6px; }
    .sigrid { --colour: #ff5900; }
    .connected { --colour: #9447f0; }
    .future { --colour: #27c6c1; }
    .senr { --colour: #2f80ed; }
    .greenpi { --colour: #90f87b; }
    .bootup { --colour: #fade29; }
    .firstline { --colour: #e53935; }
    .bpv { --colour: #546e7a; }
    .kilroy-window {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(250px, 60%);
      aspect-ratio: 1;
      overflow: hidden;
      pointer-events: none;
      z-index: 5;
    }
    .kilroy-window img {
      width: 100%;
      height: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      border-radius: 0;
      background: transparent;
    }
    @media (max-width: 700px) { .cards { grid-template-columns: repeat(2, minmax(135px, 1fr)); gap: 16px; } body { height: auto; min-height: 100vh; overflow: auto; } main { height: auto; min-height: 480px; padding: 13px 16px 22px; } }
  
    .heading { text-align: right; }
    .heading h1 { margin: 0 0 3px; font-size: 25px; }
    .heading .slogan { font-size: clamp(16px, 2.2vw, 24px); }
    @media (max-width: 700px) {
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      main { margin-top: 18px; }
      .name { font-size: 14px; }
    }
  
    .cards {width: 54%; grid-template-columns: minmax(0, 1fr); padding: 20px 18px 0;}
    .card a {max-width: none;}
    .name {font-size: 14px; margin-top: 12px;}
    @media(max-width:700px) {
      body {height:auto; min-height:100vh; overflow:auto;}
      main {height:auto; min-height:480px;}
      .cards {width:100%; padding:14px 0;}
      .card a {max-width:320px;}
          .heading h1 {font-size:21px;}
    }
    .cards {width:100%; grid-template-columns:repeat(4, minmax(0, 1fr)); justify-content:start; padding:20px 0 0; gap:20px;}
    .wonen .image-wrap img {object-fit:cover; background:#101b32;}
    @media(max-width:700px) {
      .cards {grid-template-columns:repeat(2,minmax(0,1fr)); padding:14px 0; gap:16px;}
      .card a {max-width:280px;}
      .name {font-size:14px; margin-top:12px;}
    }
</style>
</head>
<body>
  <main>
    <header>
      <a href="https://www.ter-aa.nl/" aria-label="Naar de website van Ter AA"><img class="logo" src="afbeeldingen/ter-aa-logo.png" alt="Ter AA"></a>
      <div class="heading"><h1>Keuzedelen</h1><div class="slogan">Future in the making</div></div>
    </header>
    <section class="cards" aria-label="Keuzedelen">
      <!-- Voeg toekomstige keuzedelen toe als extra article in dit raster. -->
      <article class="card" style="--colour: #27c6c1">
        <a href="K0022/" aria-label="Open keuzedeel K0022 Digitale vaardigheden">
          <span class="image-wrap"><img src="afbeeldingen/k0022-digitale-vaardigheden.png" alt="K0022 Digitale vaardigheden met Microsoft 365 en Copilot"></span>
          <span class="name">K0022 · Digitale vaardigheden</span>
        </a>
      </article>
      <article class="card wonen" style="--colour: #90c88a">
        <a href="K0877/" aria-label="Open K0877 Praktisch zelfstandig wonen met kAArel">
          <span class="image-wrap"><img src="afbeeldingen/k0877-praktisch-zelfstandig-wonen.png?v=groen" alt="kAArel, de handige huismascotte"></span>
          <span class="name">K0877 · Praktisch zelfstandig wonen</span>
        </a>
      </article>
      <article class="card arbo" style="--colour: #f2ed22">
        <a href="K0516/" aria-label="Open K0516 Arbo: fit, veilig en gezond werken">
          <span class="image-wrap"><img src="afbeeldingen/k0516-arbo.png" alt="K0516 Arbo met AArno: fit, veilig en gezond werken"></span>
          <span class="name">K0516 · Arbo</span>
        </a>
      </article>
      <article class="card ai" style="--colour: #9447f0">
        <a href="https://marcelteraa.github.io/ai-keuzedelen/" aria-label="Open K1499 en K1515 AI">
          <span class="image-wrap"><img src="afbeeldingen/k1499-k1515-ai.png" alt="AI: keuzedelen K1499 en K1515 met een vrolijke robot"></span>
          <span class="name">K1499 &amp; K1515 · AI</span>
        </a>
      </article>
    </section>
  </main>
  
</body>
</html>
