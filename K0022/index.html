function iconSvg(name){return `<img src="${appIcons[name]}" alt="Microsoft ${name}" width="64" height="64" decoding="async">`;}
function applyTheme(color){
 const frame=document.querySelector('.frame');
 frame.style.setProperty('--kleur01',color);
 frame.style.setProperty('--kleur02',`color-mix(in srgb, ${color} 28%, white)`);
 frame.style.setProperty('--kleur03',`color-mix(in srgb, ${color} 58%, white)`);
 frame.style.setProperty('--kleur04',`color-mix(in srgb, ${color} 65%, #141414)`);
}
function hexToRgba(hex,a){const h=hex.replace('#','');const n=parseInt(h,16);const r=(n>>16)&255,g=(n>>8)&255,b=n&255;return `rgba(${r},${g},${b},${a})`;}
function bgStyle(color){return `background:linear-gradient(135deg, ${hexToRgba(color,.92)}, ${hexToRgba(color,.62)}), linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.08)); border:1px solid rgba(255,255,255,.18);`;}
function ellipsePoint(cx,cy,rx,ry,i,total,start=-Math.PI/2){const ang=start + (Math.PI*2*i)/total; return {x:cx + Math.cos(ang)*rx, y:cy + Math.sin(ang)*ry};}
function clearStage(){stage.innerHTML='';stage.classList.remove('detail-stage');}
function addOrbit(cx,cy,rx,ry){const d=document.createElement('div');d.className='orbit';d.style.width=(rx*2)+'px';d.style.height=(ry*2)+'px';d.style.left=cx+'px';d.style.top=cy+'px';stage.appendChild(d);return d;}
function makeNode(tag, className, html, x, y, extraStyle=''){const el=document.createElement(tag);el.className=`node ${className} glass`;el.innerHTML=html;el.style.left=x+'px';el.style.top=y+'px';el.style.cssText += ';'+extraStyle;stage.appendChild(el);return el;}
const courseVideoStats = {"word-essential-training-microsoft-365-25327154": {"count": 34, "seconds": 11176}, "excel-essential-training-microsoft-365-33921712": {"count": 64, "seconds": 14140}, "powerpoint-essential-training-microsoft-365-26213209": {"count": 44, "seconds": 9882}, "microsoft-teams-essential-training-23929395": {"count": 61, "seconds": 13607}, "learning-onedrive-22135849": {"count": 16, "seconds": 3271}, "windows-11-essential-training-24699001": {"count": 61, "seconds": 14481}, "managing-approvals-in-microsoft-teams": {"count": 13, "seconds": 3096}, "microsoft-bookings-essential-training": {"count": 23, "seconds": 4778}, "learning-microsoft-365-copilot-for-work-2025": {"count": 13, "seconds": 2819}, "outlook-essential-training-microsoft-365-25654391": {"count": 36, "seconds": 7947}, "automate-boring-excel-tasks-with-power-query": {"count": 17, "seconds": 2594}, "microsoft-teams-working-with-apps/use-the-shifts-app-to-manage-work-schedules": {"count": 1, "seconds": 140}};
function formatPlaytime(seconds){const minutes=Math.round(seconds/60);return minutes>=60?`${Math.floor(minutes/60)} u ${String(minutes%60).padStart(2,'0')} min`:`${minutes} min`;}
function videoSummary(name){return (learningCourses[name]||[]).reduce((total,course)=>{const item=courseVideoStats[course[1]];return {count:total.count+(item?.count||0),seconds:total.seconds+(item?.seconds||0)};},{count:0,seconds:0});}
function appHtml(cat){const video=videoSummary(cat.name);return `<div class="icon-wrap">${iconSvg(cat.name)}</div><div class="label"><strong>${cat.name}</strong><span>${cat.count} links · ${video.count} video’s · ${formatPlaytime(video.seconds)}</span></div>`;}
function linkHtml(title){return `<div class="link-text">${title}</div>`;}
function calcLinkStyle(title){
  const len = title.length;
  let w = 90, h = 42, fs = 11.5;
  if(len > 14) w = 98;
  if(len > 20) { w = 106; h = 46; }
  if(len > 28) { w = 114; h = 50; fs = 11; }
  if(len > 38) { w = 122; h = 54; fs = 10.6; }
  return `width:${w}px;height:${h}px;font-size:${fs}px;`;
}
function animateToDetail(cat, clickedItem){
  const centerNode = stage.querySelector('.center');
  const homeItems = Array.from(stage.querySelectorAll('.home-item'));
  const orbits = Array.from(stage.querySelectorAll('.orbit'));
  homeItems.forEach(item => {
    if(item === clickedItem){
      item.classList.add('move-center');
      item.style.zIndex = '12';
    } else {
      item.classList.add('fade-away');
    }
  });
  if(centerNode) centerNode.classList.add('fade-away');
  orbits.forEach(o => o.classList.add('fade-away'));
  setTimeout(() => renderDetail(cat), 430);
}


function renderHome(){
  applyTheme("#ff5900");
  clearStage();
  homeBtn.hidden=true;
  const cx=500, cy=215;
  addOrbit(cx,cy,372,154);
  makeNode('div','center',`<div class="label sbb-intro"><strong>Keuzedeel K0022</strong><span>Digitale vaardigheden basis</span></div><p class="sbb-text">Je leert digitale informatie gebruiken voor je beroep. Je kiest geschikte programma’s en werkt zorgvuldig met gegevens, documenten en digitale communicatie.</p><ul class="sbb-goals"><li>Digitale informatie zoeken en verzamelen.</li><li>Informatie en content maken en delen.</li><li>Bestanden en informatie ordenen en beheren.</li></ul><p class="sbb-meta">Studiebelasting: 240 uur (SBU)</p><a class="sbb-source" href="https://kwalificatie-mijn.s-bb.nl/keuzedeel/digitale-vaardigheden-basis/cmVzdWx0YWF0VHlwZT00O2Rvc3NpZXJJZD03OTdkY2IwMS05N2EyLTQ2MmUtYmQyNy1hOTVmODY3MGJhZTk=" target="_blank" rel="noopener">Bron: SBB · bekijk de officiële beschrijving ↗</a>`,cx,cy,'justify-content:center; text-align:center; width:280px; height:132px; background:linear-gradient(135deg, rgba(17,123,211,.45), rgba(91,95,199,.35));');
  categories.forEach((cat,i)=>{
    const p=ellipsePoint(cx,cy,372,154,i,categories.length);
    const item=makeNode('button','home-item',appHtml(cat),p.x,p.y,bgStyle(cat.color));
    item.type='button';
    item.style.setProperty('--kleur01',cat.color);
    item.style.setProperty('--kleur02',`color-mix(in srgb, ${cat.color} 28%, white)`);
    item.style.setProperty('--kleur03',`color-mix(in srgb, ${cat.color} 58%, white)`);
    item.addEventListener('click',()=>animateToDetail(cat, item));
  });
}



const learningCourses = {"Word": [["Word – uitgebreide cursus", "word-essential-training-microsoft-365-25327154"]], "Excel": [["Excel – uitgebreide cursus", "excel-essential-training-microsoft-365-33921712"], ["Gegevens importeren: Power Query", "automate-boring-excel-tasks-with-power-query"]], "PowerPoint": [["PowerPoint – uitgebreide cursus", "powerpoint-essential-training-microsoft-365-26213209"]], "Outlook": [["Outlook – uitgebreide cursus", "outlook-essential-training-microsoft-365-25654391"]], "Teams": [["Teams – uitgebreide cursus", "microsoft-teams-essential-training-23929395"], ["Goedkeuringen", "managing-approvals-in-microsoft-teams"], ["Ploegendienst: Shifts", "microsoft-teams-working-with-apps/use-the-shifts-app-to-manage-work-schedules"], ["Bookings (cursus uit 2020)", "microsoft-bookings-essential-training"]], "OneDrive": [["Bestanden opslaan en delen", "learning-onedrive-22135849"]], "Windows": [["Windows 11 – uitgebreide cursus", "windows-11-essential-training-24699001"]], "Copilot": [["Microsoft 365 Copilot voor werk", "learning-microsoft-365-copilot-for-work-2025"]]};
function renderDetail(cat){
  applyTheme(cat.color);
  clearStage();
  stage.classList.add('detail-stage');
  homeBtn.hidden=false;
  const heading=document.createElement('div');
  heading.className='detail-heading';
  heading.innerHTML=`<div class="icon-wrap">${iconSvg(cat.name)}</div><span>${cat.name}</span>`;
  stage.appendChild(heading);
  const addPanel=(title,links,kind)=>{
    const panel=document.createElement('section');panel.className='resource-panel';
    const h=document.createElement('h2');h.textContent=title;panel.appendChild(h);
    const list=document.createElement('div');list.className='resource-links '+kind+'-links';
    links.forEach(link=>{
      const a=document.createElement('a');a.className='node link-item';
      a.href=link.url;a.target='_blank';a.rel='noopener';
      const label=document.createElement('span');label.className='link-text';label.textContent=link.title;if(link.stats){const info=document.createElement('small');info.className='course-stats';info.textContent=`${link.stats.count} video’s · ${formatPlaytime(link.stats.seconds)}`;label.appendChild(info);}a.appendChild(label);list.appendChild(a);
    });
    panel.appendChild(list);stage.appendChild(panel);return panel;
  };
  addPanel('Microsoft · uitleg en hulpbestanden',cat.links,'microsoft');
  const courses=(learningCourses[cat.name]||[]).map(([title,path])=>({title,stats:courseVideoStats[path],url:'https://www.linkedin.com/learning/'+path+'?u=84048860'}));
  const right=addPanel('LinkedIn Learning · video’s',courses,'learning');
  const note=document.createElement('p');note.className='learning-note';
  note.textContent='Losse video’s incl. introducties en afsluitingen. Speelduur afgerond op minuten.';note.title='Open een cursus en kies de video die je nodig hebt. Log in met je schoolaccount. Quizzen tellen niet mee.';right.appendChild(note);
}


document.getElementById('homeBtn').addEventListener('click', renderHome);
renderHome();
</script>
